[project]
name = "hopefox-ypc-linux"
version = "0.1.1"
description = "Linux client for Hopefox-branded Soulear/YPC-compatible Wi-Fi inspection cameras"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.5",
]

[dependency-groups]
dev = [
  "ruff>=0.11.5",
  "ty>=0.0.31",
]

[project.scripts]
soulear-camera = "soulear_camera.app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "soulear_camera"


[tool.ruff]
fix = true
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
  # LineTooLong
  "E501", # DoNotAssignLambda
  "E731",
]
select = [
  # flake8-2020
  "YTT", # flake8-bandit
  "S", # flake8-bugbear
  "B", # flake8-builtins
  "A", # flake8-comprehensions
  "C4", # flake8-debugger
  "T10", # flake8-simplify
  "SIM", # isort
  "I", # mccabe
  "ANN",
  "D",
  "C90", # pycodestyle
  "E",
  "W", # pyflakes
  "F", # pygrep-hooks
  "PGH", # pyupgrade
  "UP", # ruff
  "RUF", # tryceratops
  "TRY",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.ty.src]
include = ["src"]